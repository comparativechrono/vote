<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>GM2 recap: presenter</title>
  <link rel="preload" href="fonts/RecapSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/RecapSans-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/present.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%237F0055'/%3E%3C/svg%3E">
</head>
<body class="presenter">
  <div id="stage">
    <nav id="rail" aria-label="Sections and slides"></nav>
    <header id="head"><span id="sec"></span><span id="week"></span></header>
    <main id="slide"></main>
    <footer id="foot">
      <div id="joinhint"></div>
      <div id="qinfo" aria-live="polite"></div>
      <div id="tools"></div>
    </footer>
    <section id="menu" class="overlay" aria-label="Sections" hidden></section>
    <aside id="drawer" class="overlay" aria-label="Comments" hidden></aside>
    <section id="qrbig" class="overlay" aria-label="QR code" hidden></section>
    <section id="help" class="overlay" aria-label="Keys" hidden></section>
  </div>
  <div id="corner">
    <button id="help-btn" type="button" class="btn btn-small">Keys</button>
    <button id="settings-btn" type="button" class="btn btn-small">Settings</button>
  </div>
  <dialog id="settings" aria-label="Settings"></dialog>
  <noscript><p>This page needs JavaScript.</p></noscript>
  <script type="module" src="js/present.js"></script>
</body>
</html>
